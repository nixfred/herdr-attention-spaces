id = "pi.attention-spaces"
name = "Status Lights"
version = "0.4.0"
min_herdr_version = "0.8.2"
description = "Sort project lights: needs attention, then just finished (newest first), working, unknown."
platforms = ["linux"]

[[events]]
on = "pane.agent_status_changed"
command = ["python3", "status_lights.py"]

[[events]]
on = "workspace.focused"
command = ["python3", "status_lights.py"]

[[events]]
on = "tab.focused"
command = ["python3", "status_lights.py"]

[[events]]
on = "workspace.created"
command = ["python3", "status_lights.py"]

[[events]]
on = "pane.closed"
command = ["python3", "status_lights.py"]

[[actions]]
id = "sweep"
title = "Sort projects by status light"
contexts = ["global", "workspace"]
command = ["python3", "status_lights.py", "--now"]
